[Metadata]
Name=macOS-dark
Version=0.2
Author=thep0y
Description="macOS Dark Theme with Sakura Accent"
ScaleWithDPI=True

[InputPanel]
# Normal candidate text color
NormalColor=#dcdcdc
# Highlight candidate text color (sakura plum)
HighlightCandidateColor=#7B283C
# Candidate index number color (e.g. 1, 2, 3...)
CandidateLabelColor=#888888
# Highlight candidate index number color
HighlightCandidateLabelColor=#7B283C
# Preedit text color
HighlightColor=#ffffff
# Preedit highlight background color
HighlightBackgroundColor=#404040
# Full width highlight in vertical list (False for individual rounded pill)
FullWidthHighlight=False
# Page button alignment
PageButtonAlignment=Bottom

[InputPanel/Background]
Image=panel.svg

[InputPanel/Background/Margin]
Left=14
Right=14
Top=14
Bottom=14

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
# Highlight pill expansion around candidate text
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/TextMargin]
# Spacing around each candidate item inside candidates container
Left=10
Right=10
Top=6
Bottom=6

[InputPanel/ContentMargin]
# Padding between outer window border and inner candidates
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/PrevPage]
Image=

[InputPanel/PrevPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/NextPage]
Image=

[InputPanel/NextPage/ClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[Menu]
NormalColor=#dcdcdc
HighlightCandidateColor=#7B283C
Spacing=0

[Menu/Background]
Image=panel.svg

[Menu/Background/Margin]
Left=14
Right=14
Top=14
Bottom=14

[Menu/Highlight]
Image=highlight.svg

[Menu/Highlight/Margin]
Left=8
Right=8
Top=6
Bottom=6

[Menu/Separator]
Color=#404040

[Menu/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/TextMargin]
Left=8
Right=8
Top=6
Bottom=6
