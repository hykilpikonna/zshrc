patch:
  # engine/translators/+:
  #   - punct_translator
    # - r10n_translator
    # - reverse_lookup_translator
# regex: ^\\ = the input must start with a backslash; that backslash starts the latex reverse_lookup frame
  recognizer/patterns/reverse_lookup: '^\\'
  schema/dependencies/+:
    - latex
  abc_segmentor/extra_tags:
    - reverse_lookup
  reverse_lookup:
    dictionary: latex
    enable_completion: false
    tips: latex