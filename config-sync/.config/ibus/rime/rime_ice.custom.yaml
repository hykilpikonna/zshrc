patch:
  engine/processors:
    - lua_processor@*shift_schema_switcher
    - lua_processor@*select_character
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  schema/dependencies/+:
    - latex_plain
  engine/translators/+:
    - table_translator@latex_plain
  latex_plain:
    dictionary: latex_plain
    enable_sentence: false
    enable_completion: true
    enable_user_dict: false
    initial_quality: 1
